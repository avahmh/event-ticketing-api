<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سینما کده — مکان‌های برگزاری</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root {
      --bg: #faf5f5;
      --card: #fff;
      --text: #1c0a0a;
      --muted: #7f6b6b;
      --primary: #c41e3a;
      --primary-dark: #9f1239;
      --primary-soft: #fef2f2;
      --border: #ecd5d5;
      --header-from: #450a0a;
      --header-to: #991b1b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Vazirmatn", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .site-header {
      background: linear-gradient(135deg, var(--header-from), var(--header-to));
      color: #fff;
      padding: 0.85rem 1rem;
      box-shadow: 0 4px 20px rgba(69, 10, 10, 0.35);
    }
    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .brand { font-size: 1.35rem; font-weight: 700; }
    .brand span { color: #d4a853; }
    .nav a {
      color: rgba(255,255,255,0.9);
      font-size: 0.88rem;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
    }
    .nav a:hover, .nav a.active { background: rgba(255,255,255,0.12); }
    .container { max-width: 1240px; margin: 0 auto; padding: 1rem; }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .sub { color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-box {
      height: 200px;
      background: #e8e0e0;
      border-bottom: 1px solid var(--border);
    }
    .map-box.no-map {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 1rem;
      text-align: center;
    }
    .body { padding: 0.85rem; flex: 1; }
    .name { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 700; }
    .meta { margin: 0 0 0.45rem; color: var(--muted); font-size: 0.8rem; line-height: 1.55; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
    .tag {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
    }
    .map-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
    }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
    .leaflet-container { font-family: inherit; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">سینما <span>کده</span></a>
      <nav class="nav">
        <a href="/">اجرها</a>
        <a href="/venues/">مکان‌ها</a>
        <a href="/organizers/">برگزارکننده‌ها</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1>مکان‌های برگزاری</h1>
    <p class="sub">آدرس و موقعیت روی نقشه برای هر سالن و مجموعه</p>
    <div id="grid" class="grid">در حال بارگذاری…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    function hasCoords(v) {
      return v.latitude != null && v.longitude != null;
    }

    function mapsUrl(lat, lng) {
      return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}`;
    }

    function initMap(elId, lat, lng, title) {
      const map = L.map(elId, { scrollWheelZoom: false }).setView([lat, lng], 15);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      }).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup(title);
      setTimeout(() => map.invalidateSize(), 100);
    }

    function cardHtml(v, i) {
      const loc = [v.city, v.area].filter(Boolean).join("، ");
      const halls = (v.halls || []).map(h => `<span class="tag">${h.name}</span>`).join("");
      const mapBlock = hasCoords(v)
        ? `<div class="map-box" id="map-${v.id}"></div>`
        : `<div class="map-box no-map">موقعیت روی نقشه ثبت نشده<br><small>از ادمین مختصات را وارد کنید</small></div>`;
      return `<article class="card">
        ${mapBlock}
        <div class="body">
          <h2 class="name">${v.name}</h2>
          <p class="meta">${loc ? loc + "<br>" : ""}${v.address || ""}</p>
          ${v.description ? `<p class="meta">${v.description}</p>` : ""}
          ${halls ? `<div class="tags">${halls}</div>` : ""}
          ${hasCoords(v) ? `<a class="map-link" href="${mapsUrl(v.latitude, v.longitude)}" target="_blank" rel="noopener">مسیریابی در نقشه</a>` : ""}
        </div>
      </article>`;
    }

    async function load() {
      const r = await fetch("/venues/venues/");
      const data = await r.json();
      const el = document.getElementById("grid");
      if (!data.length) {
        el.innerHTML = '<p class="empty">مکانی ثبت نشده. از ادمین → مکان‌های برگزاری اضافه کنید.</p>';
        return;
      }
      el.innerHTML = data.map(cardHtml).join("");
      data.forEach(v => {
        if (hasCoords(v)) initMap(`map-${v.id}`, v.latitude, v.longitude, v.name);
      });
    }
    load();
  </script>
</body>
</html>
