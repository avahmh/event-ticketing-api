<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سینمامیکس — برگزارکننده‌ها</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf5f5;
      --card: #fff;
      --text: #1c0a0a;
      --muted: #7f6b6b;
      --primary: #c41e3a;
      --primary-dark: #9f1239;
      --primary-soft: #fef2f2;
      --border: #ecd5d5;
      --header-from: #450a0a;
      --header-to: #991b1b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Vazirmatn", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .site-header {
      background: linear-gradient(135deg, var(--header-from), var(--header-to));
      color: #fff;
      padding: 0.85rem 1rem;
      box-shadow: 0 4px 20px rgba(69, 10, 10, 0.35);
    }
    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .brand { font-size: 1.35rem; font-weight: 700; }
    .brand span { color: #fbae20; }
    .nav a {
      color: rgba(255,255,255,0.9);
      font-size: 0.88rem;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
    }
    .nav a:hover, .nav a.active { background: rgba(255,255,255,0.12); }
    .container { max-width: 1240px; margin: 0 auto; padding: 1rem; }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .sub { color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .logo-wrap {
      aspect-ratio: 1 / 1;
      position: relative;
      background: var(--primary-soft);
      overflow: hidden;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .logo-fallback {
      width: 100%;
      height: 100%;
      min-height: 0;
      border-radius: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: clamp(2rem, 10vw, 3rem);
      font-weight: 700;
    }
    .body { padding: 0.85rem; flex: 1; display: flex; flex-direction: column; }
    .name { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 700; }
    .desc {
      margin: 0 0 0.65rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .section-title { font-size: 0.72rem; color: var(--muted); margin: 0.35rem 0 0.25rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
    }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; grid-column: 1 / -1; }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
      .name { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">سینما<span>میکس</span></a>
      <nav class="nav">
        <a href="/">اجراها</a>
        <a href="/venues/">مکان‌ها</a>
        <a href="/organizers/" class="active">برگزارکننده‌ها</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1>برگزارکننده‌ها</h1>
    <p class="sub">گروه‌ها و مجموعه‌های برگزارکنندهٔ اجرا در مکان‌ها و سالن‌های مختلف</p>
    <div id="grid" class="grid">در حال بارگذاری…</div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function initial(name) {
      return (name || "?").trim().charAt(0) || "?";
    }

    function cardHtml(o) {
      const logo = o.logo_url
        ? `<img src="${escapeHtml(o.logo_url)}" alt="">`
        : `<div class="logo-fallback">${escapeHtml(initial(o.name))}</div>`;
      const venues = (o.venues || []).map(v =>
        `<span class="tag">${escapeHtml(v.name)}${v.city ? " · " + escapeHtml(v.city) : ""}</span>`
      ).join("");
      const halls = (o.halls || []).map(h =>
        `<span class="tag">${h.venue_name ? escapeHtml(h.venue_name) + " / " : ""}${escapeHtml(h.name)}</span>`
      ).join("");
      return `<article class="card">
        <div class="logo-wrap">${logo}</div>
        <div class="body">
          <h2 class="name">${escapeHtml(o.name)}</h2>
          ${o.description ? `<p class="desc">${escapeHtml(o.description)}</p>` : ""}
          ${venues ? `<p class="section-title">مکان‌های برگزاری</p><div class="tags">${venues}</div>` : ""}
          ${halls ? `<p class="section-title">سالن‌ها</p><div class="tags">${halls}</div>` : ""}
        </div>
      </article>`;
    }

    async function load() {
      const el = document.getElementById("grid");
      try {
        const r = await fetch("/api/organizers/");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        if (!Array.isArray(data)) throw new Error("bad response");
        el.innerHTML = data.length
          ? data.map(cardHtml).join("")
          : '<p class="empty">برگزارکننده‌ای ثبت نشده. از ادمین → برگزارکننده‌ها اضافه کنید.</p>';
      } catch (err) {
        el.innerHTML = '<p class="empty">خطا در بارگذاری. صفحه را دوباره باز کنید.</p>';
        console.error("load organizers failed", err);
      }
    }
    load();
  </script>
</body>
</html>
