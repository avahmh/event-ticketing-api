# Nginx site config — copy to /etc/nginx/sites-available/ticketing
# Replace YOUR_DOMAIN.com and paths if the project lives elsewhere.

server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com YOUR_SERVER_IP;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/event-ticketing-api/staticfiles/;
    }

    location /media/ {
        alias /var/www/event-ticketing-api/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
